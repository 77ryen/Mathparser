version: "3.8"

services:
  mathparser:
    build: ./mathparser
    ports:
      - "5000:5000"
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - mathparser
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

# now we can call localhost:5000 to do simple calculations on frontend directly. in script.js son:)
